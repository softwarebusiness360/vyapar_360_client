name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check feature boundaries
        run: npm run architecture:check

      - name: Check design system
        run: npm run design-system:check

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand --silent
        env:
          CI: "true"

      - name: Build production bundle
        run: npm run build
        env:
          CI: "true"

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: vyapar360-frontend-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 14
